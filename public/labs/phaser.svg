<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3c"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e06a12"/></marker>
    <style>
      .b{fill:#fff;stroke:#c7c7cc;stroke-width:2.5}
      .ba{fill:#fdf1e7;stroke:#e06a12;stroke-width:3}
      .t{font-size:30px;font-weight:650;fill:#111113}
      .s{font-size:22px;fill:#6e6e73}
      .w{stroke:#3a3a3c;stroke-width:3;fill:none;marker-end:url(#a)}
      .wo{stroke:#e06a12;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#o)}
      .l{font-size:21px;fill:#6e6e73}
    </style>
  </defs>
  <rect width="1700" height="900" fill="#fbfbfa"/>
  <text x="70" y="60" font-size="26" font-weight="600" fill="#6e6e73">Phaser · signal flow</text>

  <!-- input -->
  <rect class="b" x="70" y="250" width="200" height="110" rx="16"/>
  <text class="t" x="170" y="302" text-anchor="middle">Audio in</text>
  <text class="s" x="170" y="334" text-anchor="middle">music / sine</text>

  <!-- 4 allpass stages -->
  <g>
    <rect class="b" x="340" y="250" width="200" height="110" rx="16"/>
    <text class="t" x="440" y="302" text-anchor="middle">All-pass 1</text>
    <text class="s" x="440" y="334" text-anchor="middle">op-amp + RC</text>
    <rect class="b" x="590" y="250" width="200" height="110" rx="16"/>
    <text class="t" x="690" y="302" text-anchor="middle">All-pass 2</text>
    <text class="s" x="690" y="334" text-anchor="middle">op-amp + RC</text>
    <rect class="b" x="840" y="250" width="200" height="110" rx="16"/>
    <text class="t" x="940" y="302" text-anchor="middle">All-pass 3</text>
    <text class="s" x="940" y="334" text-anchor="middle">op-amp + RC</text>
    <rect class="b" x="1090" y="250" width="200" height="110" rx="16"/>
    <text class="t" x="1190" y="302" text-anchor="middle">All-pass 4</text>
    <text class="s" x="1190" y="334" text-anchor="middle">op-amp + RC</text>
  </g>
  <path class="w" d="M270,305 H334"/>
  <path class="w" d="M540,305 H584"/>
  <path class="w" d="M790,305 H834"/>
  <path class="w" d="M1040,305 H1084"/>
  <text class="l" x="815" y="230" text-anchor="middle">each stage shifts phase, not loudness</text>

  <!-- summing + output -->
  <rect class="b" x="1360" y="250" width="270" height="110" rx="16"/>
  <text class="t" x="1495" y="302" text-anchor="middle">Summing amp</text>
  <text class="s" x="1495" y="334" text-anchor="middle">dry + shifted</text>
  <path class="w" d="M1290,305 H1354"/>
  <path class="w" d="M300,305 V160 H1495 V244"/>
  <text class="l" x="900" y="148" text-anchor="middle">dry signal (unshifted)</text>

  <rect class="b" x="1360" y="470" width="270" height="110" rx="16"/>
  <text class="t" x="1495" y="522" text-anchor="middle">Power amp</text>
  <text class="s" x="1495" y="554" text-anchor="middle">→ speaker</text>
  <path class="w" d="M1495,360 V464"/>
  <text class="l" x="1475" y="420" text-anchor="end">"swoosh": cancellation</text>
  <text class="l" x="1475" y="446" text-anchor="end">notches sweep up and down</text>

  <!-- LFO control -->
  <rect class="ba" x="340" y="650" width="380" height="120" rx="16"/>
  <text class="t" x="530" y="702" text-anchor="middle">Control (LFO)</text>
  <text class="s" x="530" y="736" text-anchor="middle">0.5 Hz sine, 6 Vpp + 6 V DC</text>
  <rect class="ba" x="840" y="650" width="450" height="120" rx="16"/>
  <text class="t" x="1065" y="702" text-anchor="middle">CD4007 NMOS gates</text>
  <text class="s" x="1065" y="736" text-anchor="middle">transistor = voltage-controlled resistor</text>
  <path class="wo" d="M720,710 H834"/>
  <path class="wo" d="M440,650 V366"/>
  <path class="wo" d="M690,650 V366" />
  <path class="wo" d="M940,650 V366"/>
  <path class="wo" d="M1190,650 V366"/>
  <text class="l" x="1300" y="630">varies each stage's R</text>
</svg>
